name: Publish to edge

on:
  workflow_call:
    secrets:
      CHARMHUB_TOKEN:
        required: true
  workflow_dispatch:

permissions: {}

jobs:
  publish-edge:
    name: Publish to latest/edge
    runs-on: ubuntu-latest
    # Required to access secrets.CHARMHUB_TOKEN
    environment: publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee  # v1
        with:
          channel: 5.21/stable

      - name: Install charmcraft
        run: sudo snap install --classic charmcraft

      - name: Pack the charm
        run: charmcraft pack

      - name: Upload charm to latest/edge
        run: |
          set -euo pipefail
          CHARM_NAME=$(yq -e '.name' charmcraft.yaml)

          # Reuse the latest revision of each resource from Charmhub.
          # Fail if a resource has no revision.
          RESOURCE_FLAGS=()
          mapfile -t RESOURCES < <(
            # The resources map, or an empty map if the charm has none.
            yq '.resources // {}' charmcraft.yaml |
            # One resource name per line.
            yq 'keys | .[]'
          )

          for resource in "${RESOURCES[@]}"; do
            # All uploaded revisions of this resource.
            revisions=$(charmcraft resource-revisions "$CHARM_NAME" "$resource" --format json)
            # Highest revision number, empty if there is none.
            rev=$(echo "$revisions" | jq -r 'map(.revision) | max // empty')
            if [ -z "$rev" ]; then
              echo "No revision found for resource '$resource' of '$CHARM_NAME'. Upload one with 'charmcraft upload-resource' first."
              exit 1
            fi
            echo "Using $resource revision $rev"
            RESOURCE_FLAGS+=(--resource "$resource:$rev")
          done

          for charm in *.charm; do
            charmcraft upload "$charm" --release latest/edge "${RESOURCE_FLAGS[@]}"
          done
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
