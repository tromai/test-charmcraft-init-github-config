name: Publish to edge

on:
  push:
    branches:
      - "main"

permissions: {}

jobs:
  publish-edge:
    name: Publish to latest/edge
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee  # v1
        with:
          channel: 5.21/stable

      - name: Install charmcraft
        run: sudo snap install --classic charmcraft

      - name: Pack the charm
        run: charmcraft pack

      - name: Upload charm to latest/edge
        run: |
          set -euo pipefail
          CHARM_NAME=$(yq -e '.name' charmcraft.yaml)

          # Reuse the latest revision of each resource already uploaded to Charmhub.
          # Fail if a resource has no revision: upload it once manually with
          # `charmcraft upload-resource`.
          RESOURCE_FLAGS=()
          mapfile -t RESOURCES < <(yq '(.resources // {}) | keys | .[]' charmcraft.yaml)
          for resource in "${RESOURCES[@]}"; do
            rev=$(charmcraft resource-revisions "$CHARM_NAME" "$resource" --format json | jq -r 'map(.revision) | max // empty')
            if [ -z "$rev" ]; then
              echo "::error::No revision found for resource '$resource' of '$CHARM_NAME'. Upload one with 'charmcraft upload-resource' first."
              exit 1
            fi
            echo "Using $resource revision $rev"
            RESOURCE_FLAGS+=(--resource "$resource:$rev")
          done

          for charm in *.charm; do
            charmcraft upload "$charm" --release latest/edge "${RESOURCE_FLAGS[@]}"
          done
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
